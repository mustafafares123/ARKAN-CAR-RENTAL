name: ARKAN build verification

on:
  push:
    branches: [main]
    paths:
      - "arkan-web-app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, feature/arkan-enterprise-phase1]
    paths:
      - "arkan-web-app/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arkan-web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build Next.js application
        run: npm run build
