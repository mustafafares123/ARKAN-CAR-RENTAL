name: ARKAN build verification

on:
  push:
    branches: [main]
    paths:
      - "arkan-web-app/**"
      - ".github/workflows/arkan-ci.yml"
  pull_request:
    paths:
      - "arkan-web-app/**"
      - ".github/workflows/arkan-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arkan-web-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: arkan-web-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js app
        run: npm run build
