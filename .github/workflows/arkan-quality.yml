name: ARKAN quality checks

on:
  push:
    branches: [main]
    paths:
      - "arkan-web-app/**"
      - ".github/workflows/arkan-quality.yml"
  pull_request:
    paths:
      - "arkan-web-app/**"
      - ".github/workflows/arkan-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arkan-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arkan-web-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: arkan-web-app/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build production app
        run: npm run build
